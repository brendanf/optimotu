# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:

name: R-CMD-check.yaml

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest,   r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest,   r: 'release'}
          - {os: ubuntu-latest,   r: 'oldrel-1'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'

  # Compile CUDA sources. Hosted runners have no GPU, so kernel tests
  # skip when nvidia-smi fails. Running kernels needs a self-hosted
  # runner labeled `cuda-gpu`; that job is optional and not required.
  cuda-compile:
    runs-on: ubuntu-latest
    container: nvidia/cuda:12.6.0-devel-ubuntu22.04
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      # tzdata's postinst asks for a region on a TTY. The CUDA image
      # upgrades it during apt; these keep that step from waiting.
      DEBIAN_FRONTEND: noninteractive
      TZ: Etc/UTC
    steps:
      - name: Install git
        run: |
          ln -fs /usr/share/zoneinfo/Etc/UTC /etc/localtime
          echo Etc/UTC > /etc/timezone
          apt-get update
          apt-get install -y --no-install-recommends git sudo ca-certificates tzdata
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check
      - name: R CMD check (skip tests without a GPU)
        uses: r-lib/actions/check-r-package@v2
        with:
          build_args: 'c("--no-manual")'
          upload-snapshots: false
